<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Small Text Example</title>
</head>
<body>

    <!-- Method 1: HTML5 Small Tag (For fine print/disclaimers) -->
    <p>Standard price is ₹99. <small>*Terms and conditions apply.</small></p>

    <!-- Method 2: Inline CSS (For exact size control) -->
    <p style="font-size: 11px;">This text is exactly 11 pixels small.</p>

</body>
</html>
